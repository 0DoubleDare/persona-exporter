server:
  push:
    url: "https://localhost:8086/api/v2/write"
    http_headers:
        Content-Type: "application/json"
        Authorization: "text/plain; charset=utf-8"
    # Your url params, out: https://example.com?example=true&user_id=3
    url_params:
        org: "nikita-group"
        bucket: "nikita-bucket"
        precision: "ns"
    # Metric sending interval in seconds
    send_interval: 10

agent:
  # "line_protocol" / "json"
  data_type: "line_protocol"
  # "push" / "pull" (soon)
  send_model: "push"

metrics:
  global_tags:
    # variable_name: value
    hostname: "name-your-server-please"
    env: "test-servers"
  cpu:
    enabled: true
  memory:
    enabled: true
  system:
    enabled: true
  disks:
    enabled: true
  processes:
    enabled: true
    # Maximum size of the process list (excluding information about the exporter itself)
    process_limit: 5
    include_exporter_metrics: true
    remove_dead_processes: true
    # "cpu_usage" / "memory" / "virtual_memory" / "run_time" / "start_time"
    sort_by: "cpu_usage"
  network:
    enabled: true
  components:
    enabled: true
