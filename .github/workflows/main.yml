name: Build and test 

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test code
    runs-on: ubuntu-latest
    steps:
      - uses: 0DoubleDare/persona-exporter/.github/workflows/checkout_and_install.yml@main
#      - name: Checkout code
#        uses: actions/checkout@v4
#
#      - name: Install toolchain
#        uses: dtolnay/rust-toolchain@stable

      - name: Test fmt
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Test code
        run: |
          cargo test
          cargo test --doc

  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') && github.event.base_ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: persona-exporter
            asset_name: persona-exporter-linux.tar.gz
            
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: persona-exporter
            asset_name: persona-exporter-macos.zip
            
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: persona-exporter.exe
            asset_name: persona-exporter-windows.zip
    steps:
      - uses: 0DoubleDare/persona-exporter/.github/workflows/checkout_and_install.yml@main
        with:
          build_target: ${{ matrix.target }}
#      - name: Checkout code
#        uses: actions/checkout@v4
#
#      - name: Install toolchain
#        uses: dtolnay/rust-toolchain@stable
#        with:
#          target: ${{ matrix.target }}
        
      - name: Build project
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact for MacOS
        if: matrix.os == 'macos-latest'
        run: |
          cd target/${{ matrix.target }}/release/
          zip -r "../../../${{ matrix.asset_name }}" ${{ matrix.artifact_name}}

      - name: Prepare artifact for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Prepare artifact for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" -DestinationPath "${{ github.workspace }}\${{ matrix.asset_name }}"

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  release:
    name: Release to Github Releases
    if: github.event.base_ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: persona-exporter
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: persona-exporter-*
          merge-multiple: true

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
#          Создание релиза как черновик
          draft: true
          files: persona-exporter*
          generate_release_notes: true
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}