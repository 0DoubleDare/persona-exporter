name: Main pipeline

on:
  push:
    branches:
      - develop
      - main
      - unstable
      - release-candidate
  pull_request:
    branches:
      - develop
      - main
      - unstable
      - release-candidate

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    if: github.ref_name == 'main'
    needs: test
    uses: ./.github/workflows/build.yml

  release:
    if: github.ref_name == 'main'
    needs: build
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
