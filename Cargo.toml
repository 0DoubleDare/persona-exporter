[package]
name = "persona-exporter"
version = "0.2.0"
edition = "2024"

# Crates for microcontrollers (nostd)
[target.'cfg(target_os = "none")'.dependencies]
postcard = "1.1.3"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-ar"] }
embassy-time = "0.5.1"

embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"]}
reqwless = "0.14.0"

# Crates for PC (Linux, Windows, MacOS)
[target.'cfg(not(target_os = "none"))'.dependencies]
persona-exporter-types = { features = ["full"], path = "../persona-exporter-types" }
influxdb-line-protocol = "2.0.0"
sysinfo = { version = "0.39.3", features = ["system"] }
tokio = { version = "1.52.2", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
config = "0.15.24"

# Common crates (for PC & nostd)
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
opt-level = "s"
debug = false
codegen-units = 1
lto = true
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Lider Nikita <lidernikita661@gmail.com>"
copyright = "2026 Lider Nikita <lidernikita661@gmail.com>"
systemd-units = { enable = true, unit-scripts = "src/configs/", unit-name = "persona-exporter", restart-after-upgrade = true }
extended-description = """\
Lightweight system metrics exporter for Prometheus\
A lightweight exporter written in Rust that monitors core system\
metrics such as CPU, RAM, Disk space, and component temperatures.\
Designed with a focus on a "set-and-forget" approach."""
depends = "$auto, systemd"
section = "utility"
priority = "optional"
